<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل دخول NAVIDUROR</title>
  <link rel="stylesheet" href="/naviduror/style.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-brand">
        <div class="brand-mark">N</div>
        <div>
          <h1>NAVIDUROR</h1>
          <p>نظام معايرة وتحقق الدرور.</p>
        </div>
      </div>
      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="form-row">
          <label for="loginUsername">اسم المستخدم</label>
          <input id="loginUsername" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="form-row">
          <label for="loginPassword">كلمة المرور</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="authError" class="form-error" aria-live="polite"></div>
        <button id="loginBtn" class="primary-btn" type="submit">تسجيل الدخول</button>
      </form>
      <div class="login-hint">
        <p>يستخدم النظام مصادقة المشروع إذا كانت متاحة. هذه صفحة معزولة خاصة بـ NAVIDUROR.</p>
      </div>
    </section>
  </main>
  <script src="/naviduror/login.js"></script>
</body>
</html>
