<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مركز سلامة تشغيل NAVIDUR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: "Tajawal", "Noto Sans Arabic", Arial, sans-serif; margin: 0; background: #0b1324; color: #dbe9ff; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .card { background: #13213a; border: 1px solid #213760; border-radius: 12px; padding: 12px; }
    .k { color: #8fb1de; font-size: 14px; }
    .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    #stationMap { height: 420px; border-radius: 12px; overflow: hidden; }
    .table-wrap { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 760px; }
    th, td { border-bottom: 1px solid #1e3358; padding: 10px; text-align: right; vertical-align: top; white-space: nowrap; }
    td.message-cell, td.hint-cell { white-space: normal; min-width: 230px; }
    .sev-critical { color: #ff6b6b; }
    .sev-warning { color: #ffd166; }
    .sev-ok { color: #7ae582; }
    button { background: #2150a4; border: 0; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .muted { color: #9bb3d3; font-size: 13px; }
    @media (max-width: 980px) {
      .cards { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      #stationMap { height: 320px; }
      table { font-size: 14px; min-width: 680px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>مركز سلامة تشغيل NAVIDUR</h2>
    <div class="muted">منصة تشخيص فقط بدون أي إصلاح تلقائي صامت.</div>
    <div style="margin:12px 0;"><button id="reloadBtn">تحديث</button> <span id="generatedAt" class="muted"></span></div>
    <section class="cards">
      <div class="card"><div class="k">الحالة العامة</div><div id="status" class="v">—</div></div>
      <div class="card"><div class="k">أخطاء حرجة</div><div id="critical" class="v">—</div></div>
      <div class="card"><div class="k">تحذيرات</div><div id="warnings" class="v">—</div></div>
      <div class="card"><div class="k">سليم</div><div id="okCount" class="v">—</div></div>
    </section>
    <section class="grid">
      <div class="card">
        <h3>خريطة سلامة المحطات</h3>
        <div id="stationMap"></div>
      </div>
      <div class="card">
        <h3>زمن استجابة الخدمات</h3>
        <div class="table-wrap"><table id="latencyTable"><tbody></tbody></table></div>
      </div>
    </section>
    <section class="card" style="margin-top:12px;">
      <h3>الملاحظات النشطة</h3>
      <div class="table-wrap"><table id="findingsTable">
        <thead><tr><th>الخطورة</th><th>النوع</th><th>المحطة</th><th>الرسالة</th><th>اقتراح الإصلاح</th><th>الوقت</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = null;
    let stationById = {};

    function byId(id) { return document.getElementById(id); }
    function tSeverity(sev) {
      if (sev === 'critical') return 'حرج';
      if (sev === 'warning') return 'تحذير';
      return 'سليم';
    }
    function tIssue(msg) {
      const m = String(msg || '').trim();
      const map = {
        operational_station_without_reference: 'محطة تشغيلية بدون مرجع',
        orphan_operational_station: 'محطة تشغيلية يتيمة',
        station_outside_gulf_bounds: 'محطة خارج نطاق الخليج',
        station_missing_name_ar: 'اسم عربي مفقود',
        station_role_type_missing: 'نوع دور المحطة مفقود',
        latitude_band_key_missing: 'نطاق خط العرض مفقود',
        workbook_city_key_missing: 'مفتاح المدينة المرجعية مفقود',
        NAVIDUR_TIDE_FAILED: 'فشل بيانات المد والجزر'
      };
      return map[m] || m || 'غير معروف';
    }
    function fixHint(msg) {
      const m = String(msg || '').trim();
      const hints = {
        operational_station_without_reference: 'حدّد reference_station_id صالح للمحطة التشغيلية.',
        orphan_operational_station: 'راجع جدول المراجع واربط المحطة بمحطة مرجعية فعّالة.',
        station_outside_gulf_bounds: 'تأكد من صحة الإحداثيات أو صنّف المحطة خارج النطاق التشغيلي.',
        station_missing_name_ar: 'أضف name_ar للمحطة لعرض عربي صحيح.',
        station_role_type_missing: 'أضف station_role_type (تشغيلية/مرجعية/عمق...).',
        latitude_band_key_missing: 'أضف latitude_band_key المستخدم في الربط الوراثي.',
        workbook_city_key_missing: 'أضف workbook_city_key المتوافق مع مرجع workbook.',
        NAVIDUR_TIDE_FAILED: 'تحقق من endpoint Stormglass والاعتماد والمفاتيح والـ URL.'
      };
      return hints[m] || 'يلزم مراجعة السجل والبيانات المرتبطة بهذه المشكلة.';
    }
    function colorBySeverity(sev) {
      if (sev === 'critical') return '#ef4444';
      if (sev === 'warning') return '#f59e0b';
      return '#22c55e';
    }
    function stationSeverityFromFindings(stationId, findings) {
      const rows = findings.filter(f => String(f.station_id || '') === String(stationId || ''));
      if (!rows.length) return 'ok';
      if (rows.some(r => r.severity === 'critical')) return 'critical';
      if (rows.some(r => r.severity === 'warning')) return 'warning';
      return 'ok';
    }

    async function loadStations() {
      const res = await fetch('/api?route=stations', { cache: 'no-store' });
      const json = await res.json();
      const rows = Array.isArray(json.stations) ? json.stations : [];
      stationById = {};
      rows.forEach(s => { stationById[String(s.id)] = s; });
      return rows;
    }

    function collectFindings(report) {
      const checks = report && report.checks ? report.checks : {};
      const out = [];
      Object.keys(checks).forEach(name => {
        const rows = Array.isArray(checks[name].findings) ? checks[name].findings : [];
        rows.forEach(r => out.push(Object.assign({ check: name }, r)));
      });
      return out;
    }

    function resetSummaryToUnknown() {
      byId('status').textContent = '—';
      byId('status').className = 'v';
      byId('critical').textContent = '—';
      byId('warnings').textContent = '—';
      byId('okCount').textContent = '—';
      byId('generatedAt').textContent = 'آخر تحديث: —';
    }

    function renderReportError(statusCode) {
      const code = Number(statusCode);
      if (code === 401 || code === 403) {
        byId('status').textContent = 'تحتاج تسجيل دخول إداري';
      } else {
        byId('status').textContent = 'تعذر قراءة تقرير السلامة' + (Number.isFinite(code) && code > 0 ? (' (' + code + ')') : '');
      }
      byId('status').className = 'v sev-warning';
      byId('critical').textContent = '—';
      byId('warnings').textContent = '—';
      byId('okCount').textContent = '—';
    }

    function renderMap(stations, findings) {
      if (!map) {
        map = L.map('stationMap').setView([25.5, 51.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
      }
      map.eachLayer(layer => {
        if (layer instanceof L.CircleMarker || layer instanceof L.Marker) map.removeLayer(layer);
      });
      stations.forEach(s => {
        const lat = Number(s.lat), lon = Number(s.lon != null ? s.lon : s.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        const sev = stationSeverityFromFindings(s.id, findings);
        L.circleMarker([lat, lon], { radius: 6, color: colorBySeverity(sev), fillOpacity: 0.9, weight: 1 })
          .bindPopup((s.name_ar || s.name || s.id) + ' - ' + tSeverity(sev)).addTo(map);
      });
    }

    function renderLatency(report) {
      const body = byId('latencyTable').querySelector('tbody');
      const api = report && report.checks && report.checks.checkApiIntegrity && report.checks.checkApiIntegrity.metrics
        ? report.checks.checkApiIntegrity.metrics : {};
      const weather = report && report.checks && report.checks.checkWeatherIntegrity && report.checks.checkWeatherIntegrity.metrics
        ? report.checks.checkWeatherIntegrity.metrics : {};
      const rows = [
        ['Stormglass', api.stormglass && api.stormglass.ms, api.stormglass && (api.stormglass.ok ? 'سليم' : 'فشل')],
        ['Open-Meteo', weather.open_meteo && weather.open_meteo.ms, weather.open_meteo && (weather.open_meteo.ok ? 'سليم' : 'فشل')],
        ['Marine Open-Meteo', weather.marine_open_meteo && weather.marine_open_meteo.ms, weather.marine_open_meteo && (weather.marine_open_meteo.ok ? 'سليم' : 'فشل')]
      ];
      body.innerHTML = rows.map(r => '<tr><td>' + r[0] + '</td><td>' + (r[1] != null ? r[1] + ' مللي ثانية' : '—') + '</td><td>' + (r[2] || '—') + '</td></tr>').join('');
    }

    function renderFindings(findings) {
      const body = byId('findingsTable').querySelector('tbody');
      body.innerHTML = findings.slice(0, 120).map(f => {
        const s = stationById[String(f.station_id || '')];
        const sName = s ? (s.name_ar || s.name || s.id) : (f.station_id || '—');
        const issueType = tIssue(f.message || f.type || f.check);
        const hint = fixHint(f.message || f.type || f.check);
        return '<tr>'
          + '<td class="sev-' + (f.severity || 'ok') + '">' + tSeverity(f.severity || 'ok') + '</td>'
          + '<td>' + issueType + '</td>'
          + '<td>' + sName + '</td>'
          + '<td class="message-cell">' + (tIssue(f.message) || '—') + '</td>'
          + '<td class="hint-cell">' + hint + '</td>'
          + '<td>' + (f.created_at || '—') + '</td>'
          + '</tr>';
      }).join('');
    }

    async function refresh() {
      resetSummaryToUnknown();
      const stationsRes = await loadStations();
      const endpoint = '/api/admin/system-integrity?ts=' + Date.now();
      let res;
      try {
        res = await fetch(endpoint, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-store, no-cache, must-revalidate',
            'Pragma': 'no-cache'
          }
        });
      } catch (_networkErr) {
        renderReportError(0);
        renderFindings([]);
        renderMap(stationsRes, []);
        return;
      }

      if (!res.ok) {
        renderReportError(res.status);
        renderFindings([]);
        renderMap(stationsRes, []);
        return;
      }

      let integrityRes;
      try {
        integrityRes = await res.json();
      } catch (_jsonErr) {
        renderReportError(res.status || 0);
        renderFindings([]);
        renderMap(stationsRes, []);
        return;
      }

      if (!integrityRes || typeof integrityRes !== 'object' || !integrityRes.summary || !integrityRes.status) {
        renderReportError(res.status || 0);
        renderFindings([]);
        renderMap(stationsRes, []);
        return;
      }

      const findings = collectFindings(integrityRes);
      byId('status').textContent = tSeverity(integrityRes.status);
      byId('status').className = 'v sev-' + integrityRes.status;
      byId('critical').textContent = integrityRes.summary.critical;
      byId('warnings').textContent = integrityRes.summary.warnings;
      byId('okCount').textContent = integrityRes.summary.ok;
      byId('generatedAt').textContent = 'آخر تحديث: ' + (integrityRes.generated_at || '—');
      renderLatency(integrityRes);
      renderFindings(findings);
      renderMap(stationsRes, findings);
    }

    byId('reloadBtn').addEventListener('click', refresh);
    refresh().catch(err => alert('تعذر تحميل بيانات السلامة: ' + (err && err.message ? err.message : err)));
  </script>
</body>
</html>
