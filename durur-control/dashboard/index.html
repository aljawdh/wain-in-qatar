<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durur Control</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+4P1D7b4tJ2oleZ7M5KKX0dGuN8s8S8UmtjM/ai3s=" crossorigin="" />
  <link rel="stylesheet" href="/durur-control/style.css">
</head>
<body>
  <div class="page-shell">
    <div class="panel">
      <div class="topbar">
        <div>
          <h1>Durur Control</h1>
          <p style="margin:4px 0 0; color: var(--muted);">لوحة تحكم مستقلة لخريطة المحطات.</p>
        </div>
        <div class="top-actions">
          <span class="user-pill">المستخدم: admin</span>
          <button id="logoutBtn" class="button" style="background: transparent; color: var(--accent); border: 1px solid rgba(91,198,255,.25);">تسجيل خروج</button>
        </div>
      </div>
      <div class="dashboard-layout">
        <aside class="sidebar">
          <nav>
            <a href="#" class="active">المحطات</a>
            <a href="#">الدرور</a>
            <a href="#">الأحداث</a>
            <a href="#">التحليل</a>
          </nav>
        </aside>
        <main class="main-panel">
          <div class="main-content">
            <div class="map-header">
              <h2 class="section-title">خريطة المحطات</h2>
              <p style="margin: 4px 0 0; color: var(--muted);">اضغط على أي محطة لعرض البيانات أسفل الخريطة.</p>
            </div>
            <div id="stationMap" class="map-frame"></div>
            <div id="stationInfoCard" class="station-info-card">
              <h3>معلومات المحطة</h3>
              <div id="stationInfoBody" class="station-info-body">اختر محطة من الخريطة</div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/durur-control/dashboard.js"></script>
</body>
</html>
