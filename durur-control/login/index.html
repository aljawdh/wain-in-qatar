<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durur Control Login</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-shell">
    <div class="center-card card panel">
      <h1>Durur Control Login</h1>
      <p style="color: var(--muted); margin-top: 12px;">أدخل بيانات الاعتماد للدخول إلى لوحة التحكم المستقلة.</p>
      <div class="input-group">
        <label for="username">اسم المستخدم</label>
        <input id="username" type="text" placeholder="admin" autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="1234" autocomplete="current-password">
      </div>
      <button id="loginBtn" class="button" style="margin-top: 18px; width: 100%;">دخول</button>
      <div id="errorMessage" class="notice" role="alert" aria-live="polite" style="display:none;"></div>
    </div>
  </div>
  <script src="../login.js"></script>
</body>
</html>
